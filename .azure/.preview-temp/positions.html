<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Positions — Preview</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="preview-root">
    <header class="preview-header">
      <div class="preview-header__brand"><div class="preview-header__logo">C</div><span>Cheeta</span></div>
      <div class="preview-header__actions"><a class="preview-header__action" href="#">Export</a><button class="preview-button preview-button--primary">Refresh</button></div>
    </header>
    <nav class="preview-nav">
      <a class="preview-nav__link" href="./dashboard.html">Dashboard</a>
      <a class="preview-nav__link preview-nav__link--active" href="#">Positions</a>
      <a class="preview-nav__link" href="./markets.html">Markets</a>
    </nav>
    <div class="preview-shell">
      <aside class="preview-sidebar">
        <div class="preview-sidebar__section">Views</div>
        <a href="#" class="preview-sidebar__item preview-sidebar__item--active">Open positions</a>
        <a href="#" class="preview-sidebar__item">Closed trades</a>
        <a href="#" class="preview-sidebar__item">P&amp;L</a>
      </aside>
      <main class="preview-main">
        <section class="preview-empty">
          <div class="preview-empty__inner">
            <div class="preview-empty__icon">○</div>
            <h2>No open positions yet</h2>
            <p>Connect a provider or add a watchlist to start tracking market exposure.</p>
            <button class="preview-button preview-button--primary">Connect provider</button>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
